<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Port Harcourt satellite orientation</title><style>*{box-sizing:border-box}body{margin:0;font:13px Arial;color:white;background:#102f35}#map{position:relative;height:100vh;overflow:hidden;touch-action:none;cursor:grab}#tiles{position:absolute;inset:0}#tiles img{position:absolute;width:256px;height:256px}.badge{position:absolute;left:20px;top:20px;background:#002b49e8;padding:15px 18px;pointer-events:none}.badge b{display:block;font-size:18px;margin-bottom:5px}.controls{position:absolute;right:15px;top:15px;display:grid;gap:5px}button{width:42px;height:42px;border:0;color:#002b49;background:white;font-size:24px;cursor:pointer}.credits{position:absolute;bottom:0;left:0;right:0;background:#002b49e8;padding:8px 12px;font-size:10px}.credits a{color:white}#error{position:absolute;left:20px;bottom:50px;background:#002b49;padding:14px;max-width:300px}#error[hidden]{display:none}</style></head><body><div id="map" aria-label="Interactive satellite orientation map"><div id="tiles"></div><div class="badge"><b id="place">Port Harcourt</b><span>Regional orientation · drag to explore</span></div><div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset map">⌂</button></div><p id="error" hidden>Satellite tiles need an internet connection. <a href="https://www.google.com/maps/search/Port+Harcourt+Nigeria" target="_blank" style="color:white">Open the external map ↗</a></p><div class="credits">Imagery © Esri, Maxar, Earthstar Geographics and the GIS User Community · <a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener">Map source</a> · Orientation only, not for navigation</div></div><script>const q=new URLSearchParams(location.search),onne=(q.get('place')||'').includes('Onne'),street=q.get('mode')==='street';let z=12,lat=Number(q.get('lat'))||(onne?4.686:4.8156),lon=Number(q.get('lon'))||(onne?7.151:7.0498);const initial=[lat,lon];document.querySelector('#place').textContent=q.get('label')||(onne?'Onne region':'Port Harcourt');function xy(){const n=2**z;return[(lon+180)/360*n,(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n]}function render(){const m=document.querySelector('#map'),t=document.querySelector('#tiles'),[x,y]=xy(),w=m.clientWidth,h=m.clientHeight;t.innerHTML='';let errors=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const tx=Math.floor(x)+dx,ty=Math.floor(y)+dy,im=document.createElement('img');im.alt='';im.draggable=false;im.style.left=(w/2+(tx-x)*256)+'px';im.style.top=(h/2+(ty-y)*256)+'px';im.src='https://services.arcgisonline.com/ArcGIS/rest/services/'+(street?'World_Street_Map':'World_Imagery')+'/MapServer/tile/'+z+'/'+ty+'/'+tx;im.onerror=()=>{if(++errors>5)document.querySelector('#error').hidden=false};im.onload=()=>document.querySelector('#error').hidden=true;t.append(im)}}document.querySelector('#plus').onclick=()=>{z=Math.min(16,z+1);render()};document.querySelector('#minus').onclick=()=>{z=Math.max(9,z-1);render()};document.querySelector('#reset').onclick=()=>{[lat,lon]=initial;z=12;render()};let drag;const m=document.querySelector('#map');m.onpointerdown=e=>{if(e.target.closest('button,a'))return;drag=[e.clientX,e.clientY,...xy()];m.setPointerCapture(e.pointerId)};m.onpointerup=e=>{if(!drag)return;const n=2**z,x=drag[2]-(e.clientX-drag[0])/256,y=drag[3]-(e.clientY-drag[1])/256;lon=x/n*360-180;lat=Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;drag=null;render()};addEventListener('resize',render);render();setTimeout(()=>{if(![...document.querySelectorAll("#tiles img")].some(i=>i.complete&&i.naturalWidth))document.querySelector("#error").hidden=false},8000);</script></body></html>
